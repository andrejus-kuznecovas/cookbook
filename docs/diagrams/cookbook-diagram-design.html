<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookbook — system architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Cookbook</p>
    <h1>Two phones, one kitchen: how Cookbook ships and serves</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cookbook-arch-title cookbook-arch-desc">
        <title id="cookbook-arch-title">Cookbook system architecture</title>
        <desc id="cookbook-arch-desc">Code pushed to GitHub is tested by GitHub Actions and auto-deployed to a Django app on PythonAnywhere, which both partners' phones use over HTTPS with shared state in SQLite.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: PythonAnywhere (painted before arrows and nodes) -->
        <rect x="496" y="256" width="432" height="224" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="508" y="260" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="572" y="269" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">PYTHONANYWHERE FREE TIER</text>

        <!-- Arrows (drawn before boxes) -->
        <!-- Laptop -> GitHub -->
        <line x1="176" y1="92" x2="288" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="208" y="72" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="232" y="81" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">GIT PUSH</text>

        <!-- GitHub -> Actions -->
        <line x1="416" y1="92" x2="528" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="440" y="72" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="472" y="81" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TRIGGERS CI</text>

        <!-- Actions -> Django (vertical, dashed: async deploy) -->
        <line x1="600" y1="120" x2="600" y2="288" stroke="#4f5d75" stroke-width="1"
              stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="608" y="192" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="612" y="201" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.06em">AUTO-DEPLOY</text>

        <!-- Phones -> Django (headline path, accent) -->
        <line x1="184" y1="318" x2="528" y2="318" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="320" y="298" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="356" y="307" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">HTTPS LOGIN</text>

        <!-- Django -> SQLite -->
        <line x1="688" y1="318" x2="768" y2="318" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="712" y="298" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="728" y="307" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">ORM</text>

        <!-- Phones -> Static files (dashed asset fetch; down then right) -->
        <path d="M 116,348 V 424 Q 116,432 124,432 H 528"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="276" y="412" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="421" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">ASSETS</text>

        <!-- Nodes -->
        <!-- Laptop (external) -->
        <rect x="48" y="64" width="128" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="64" width="128" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="56" y="70" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="70" y="79" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">DEV</text>
        <text x="112" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Laptop</text>
        <text x="112" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">cursor + git</text>

        <!-- GitHub (external) -->
        <rect x="288" y="64" width="128" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="64" width="128" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="296" y="70" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="310" y="79" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">GIT</text>
        <text x="352" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">GitHub</text>
        <text x="352" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">main branch</text>

        <!-- GitHub Actions (external) -->
        <rect x="528" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="64" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="536" y="70" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="550" y="79" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">CI</text>
        <text x="600" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">GitHub Actions</text>
        <text x="600" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">48 tests, gate</text>

        <!-- Two phones (input) -->
        <rect x="48" y="288" width="136" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="288" width="136" height="60" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="56" y="294" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="70" y="303" fill="rgba(90,101,128,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">PWA</text>
        <text x="116" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Two phones</text>
        <text x="116" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">android + ios</text>

        <!-- Django app (focal) -->
        <rect x="528" y="288" width="160" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="288" width="160" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="536" y="294" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="550" y="303" fill="rgba(191,69,32,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="608" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Django app</text>
        <text x="608" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">recipes / meal plan</text>

        <!-- SQLite (store) -->
        <rect x="768" y="288" width="128" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="288" width="128" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="776" y="294" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="790" y="303" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="832" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">SQLite</text>
        <text x="832" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">db.sqlite3</text>

        <!-- Static files (store) -->
        <rect x="528" y="404" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="404" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="536" y="410" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="550" y="419" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.08em">FS</text>
        <text x="608" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Static files</text>
        <text x="608" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">whitenoise /static/</text>

        <!-- Legend (horizontal strip, outside the diagram area) -->
        <line x1="30" y1="496" x2="930" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.14em">LEGEND</text>

        <rect x="110" y="508" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="134" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">FOCAL APP</text>

        <rect x="250" y="508" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="274" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">USERS</text>

        <rect x="370" y="508" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="394" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">STORAGE</text>

        <rect x="510" y="508" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="534" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">EXTERNAL</text>

        <line x1="650" y1="513" x2="682" y2="513" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="690" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">ASYNC / PASSIVE</text>
      </svg>
    </div>
  </div>
</body>
</html>
