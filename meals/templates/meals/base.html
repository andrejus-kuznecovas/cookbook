<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f97316">
  <title>{% block title %}Cookbook{% endblock %}</title>
  <style>
    :root {
      --accent: #f97316;
      --accent-dark: #c2410c;
      --accent-soft: #fff7ed;
      --accent-border: #fed7aa;
      --bg: #faf8f5;
      --surface: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --shadow: 0 1px 3px rgba(28, 25, 23, 0.06), 0 4px 14px rgba(28, 25, 23, 0.05);
      --shadow-lift: 0 4px 10px rgba(28, 25, 23, 0.08), 0 12px 28px rgba(28, 25, 23, 0.10);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    /* Smooth cross-fade between page loads (modern browsers). */
    @view-transition { navigation: auto; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    /* ---------- Header ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(250, 248, 245, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 620px;
      margin: 0 auto;
      padding: 0.7rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--text);
    }
    .brand svg { width: 26px; height: 26px; }
    nav { display: flex; gap: 0.35rem; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      transition: background 0.15s, color 0.15s;
    }
    nav a:hover, nav a.active { background: var(--accent-soft); color: var(--accent-dark); }

    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 1.25rem 1rem 7rem;
    }
    /* The recipe list gets a wider canvas on desktop. */
    body.page-recipes main,
    body.page-recipes .header-inner,
    body.page-recipes .actionbar-inner { max-width: 1020px; }
    .recipe-grid { display: grid; grid-template-columns: 1fr; gap: 0.55rem; align-items: start; }
    @media (min-width: 760px) {
      .recipe-grid { grid-template-columns: 1fr 1fr; gap: 0.9rem; }
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0.4rem 0 0.2rem;
    }
    .subtitle { color: var(--muted); margin: 0 0 1.3rem; font-size: 0.95rem; }

    /* ---------- Recipe cards ---------- */
    .recipe-card {
      position: relative;
      background: var(--surface);
      border: 2px solid transparent;
      border-radius: 14px;
      box-shadow: var(--shadow);
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s, transform 0.1s;
      overflow: hidden;
    }
    .recipe-card:active { transform: scale(0.995); }
    .recipe-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .recipe-card input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .recipe-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .recipe-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      row-gap: 0.15rem;
      min-width: 0;
    }
    .check-ring {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #d6d3d1;
      background: white;
      display: grid;
      place-items: center;
      transition: border-color 0.18s, background 0.18s;
    }
    .check-ring svg {
      width: 14px;
      height: 14px;
      stroke: white;
      stroke-width: 3.5;
      fill: none;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.15s, transform 0.15s;
    }
    .recipe-card.selected .check-ring {
      border-color: var(--accent);
      background: var(--accent);
    }
    .recipe-card.selected .check-ring svg { opacity: 1; transform: scale(1); }
    .recipe-title { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
    .chip {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.12rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .recipe-card.selected .chip { background: white; }

    details { border-top: 1px solid var(--border); }
    .recipe-card.selected details { border-top-color: var(--accent-border); }
    details summary {
      list-style: none;
      cursor: pointer;
      padding: 0.5rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent-dark);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      -webkit-tap-highlight-color: transparent;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary .chev {
      width: 14px; height: 14px;
      stroke: currentColor; stroke-width: 2.5; fill: none;
      transition: transform 0.2s;
    }
    details[open] summary .chev { transform: rotate(90deg); }
    .details-body { padding: 0 1rem 0.9rem; }
    .details-body ul { margin: 0.2rem 0 0.6rem; padding: 0; list-style: none; }
    .details-body li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.32rem 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.92rem;
    }
    .details-body li:last-child { border-bottom: none; }
    .details-body li .amount { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .instructions { color: var(--muted); font-size: 0.9rem; margin: 0.4rem 0 0; }

    /* ---------- Week calendar ---------- */
    .week-cal {
      background: var(--surface);
      border: none;
      border-radius: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .week-cal summary {
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .week-cal summary .cal-icon { width: 16px; height: 16px; stroke: var(--accent); stroke-width: 2; fill: none; }
    .week-cal summary .range { color: var(--muted); font-weight: 600; }
    .week-cal summary .chev { margin-left: auto; }
    .week-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.35rem;
      padding: 0 0.8rem 0.8rem;
    }
    .day-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.05rem;
      padding: 0.45rem 0.1rem;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      font: inherit;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .day-pill .dow {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .day-pill .dom { font-size: 1.02rem; font-weight: 700; }
    .day-pill.today { border-color: var(--accent); }
    .day-pill.today .dow { color: var(--accent-dark); }
    .day-pill.marked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .day-pill.marked .dow, .day-pill.marked .dom { color: white; }
    .cal-hint {
      padding: 0 1rem 0.7rem;
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ---------- Sticky action bar ---------- */
    .actionbar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-bottom));
      background: rgba(250, 248, 245, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }
    .actionbar-inner {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .selected-count { font-size: 0.9rem; font-weight: 600; color: var(--muted); flex: 1; }
    .selected-count strong { color: var(--text); }

    button, .btn {
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.7rem 1.35rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: transform 0.1s, box-shadow 0.15s, background 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active, .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ea580c);
      color: white;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(249, 115, 22, 0.45); }
    .btn-primary:disabled {
      opacity: 0.45;
      box-shadow: none;
      cursor: default;
      transform: none;
    }
    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .btn-ghost:hover { border-color: #d6d3d1; }

    /* ---------- Shopping list ---------- */
    .progress-note { font-size: 0.88rem; font-weight: 600; color: var(--muted); margin-bottom: 0.6rem; }
    .shop-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.4rem 1.1rem;
      margin-bottom: 1rem;
    }
    .shop-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .shop-item:last-child { border-bottom: none; }
    .shop-item input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; }
    .shop-item .item-text { flex: 1; transition: opacity 0.2s; }
    .shop-item .item-name { font-weight: 600; font-size: 0.98rem; }
    .shop-item .item-recipes { font-size: 0.78rem; color: var(--muted); margin-top: 0.05rem; }
    .qty-badge {
      flex-shrink: 0;
      font-size: 0.82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent-dark);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .shop-item.done .item-text { opacity: 0.4; }
    .shop-item.done .item-name { text-decoration: line-through; }
    .shop-item.done .qty-badge { opacity: 0.4; }
    .shop-item.done .check-ring { border-color: var(--accent); background: var(--accent); }
    .shop-item.done .check-ring svg { opacity: 1; transform: scale(1); }

    /* ---------- Forms ---------- */
    .form-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.3rem 1.1rem;
      margin-bottom: 1rem;
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }
    input[type="text"], input[type="number"], textarea, select {
      font: inherit;
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background: white;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }
    textarea { resize: vertical; min-height: 90px; }
    .ing-row {
      display: grid;
      grid-template-columns: 1fr 4.6rem 5.4rem 2rem;
      gap: 0.45rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .ing-row .remove-row {
      width: 2rem;
      height: 2rem;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      display: grid;
      place-items: center;
    }
    .ing-row .remove-row:hover { color: #dc2626; background: #fef2f2; }
    .add-row-btn {
      background: transparent;
      border: 1.5px dashed var(--border);
      color: var(--accent-dark);
      width: 100%;
      padding: 0.6rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .add-row-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .error-banner {
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      color: #b91c1c;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }
    .error-banner ul { margin: 0; padding-left: 1.1rem; }
    .btn-danger {
      background: transparent;
      color: #dc2626;
      border: 1.5px solid #fecaca;
    }
    .btn-danger:hover { background: #fef2f2; }
    .edit-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-dark);
      text-decoration: none;
    }
    .edit-link:hover { text-decoration: underline; }
    .edit-link svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* ---------- Toasts ---------- */
    .toast {
      background: #14532d;
      color: #dcfce7;
      border-radius: 12px;
      padding: 0.75rem 1.1rem;
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      animation: toast-in 0.25s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Empty state ---------- */
    .empty {
      text-align: center;
      padding: 3rem 1.5rem;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .empty svg { width: 52px; height: 52px; stroke: var(--accent); margin-bottom: 0.6rem; }
    .empty p { margin: 0 0 1.2rem; color: var(--muted); font-weight: 500; }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header>
    <div class="header-inner">
      <a class="brand" href="{% url 'recipe_list' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7v-2z"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        Cookbook
      </a>
      <nav>
        <a href="{% url 'shopping_list' %}" {% if request.resolver_match.url_name == 'shopping_list' %}class="active"{% endif %}>Shopping list</a>
        <a href="{% url 'recipe_new' %}" {% if request.resolver_match.url_name == 'recipe_new' %}class="active"{% endif %}>New recipe</a>
      </nav>
    </div>
  </header>
  <main>
    {% if messages %}
      {% for message in messages %}
      <div class="toast">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
